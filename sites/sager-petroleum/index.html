<style>
/* Layout: dark industrial bands (header, hero, story, spotlight, footer) alternate with paper-white shop sections. Square cards, mono product numbers like drum stencils, one petroleum amber accent. */
:root{
  --ink-950:#0B0C0E; --ink-900:#111316; --ink-700:#262A30; --ink-600:#363B43; --ink-500:#4C525B; --ink-300:#9AA0A8; --ink-200:#C8CBD0;
  --paper:#F7F6F2; --paper-2:#EEECE5; --white:#FFFFFF;
  --amber:#E2761C; --amber-hi:#F09A45; --amber-deep:#8A440A; --on-amber:#0B0C0E;
  --t-fuel:#E2761C; --t-engine:#3E6FA6; --t-grease:#3F7D4E; --t-gear:#8C5A2B; --t-hyd:#2C7F86; --t-trans:#6A51A0; --t-torque:#A13D3D; --t-tractor:#647F2E; --t-ind:#5A6573; --t-spec:#A86A2A;

  --bg:var(--paper); --bg-2:var(--paper-2); --surface:var(--white);
  --text:var(--ink-950); --text-2:var(--ink-600); --text-3:var(--ink-500);
  --rule:rgba(11,12,14,.12); --rule-strong:rgba(11,12,14,.26);
  --accent-text:var(--amber-deep); --focus:#C2610F;
  --media:#ECEAE3; --label:#FBFAF6; --label-ink:#0B0C0E; --label-ink-2:#555B63;
  --drum:#24282E; --drum-rim:#3A3F47; --jug:#E4E1D8; --jug-edge:#BDB8AC;
  --shadow:rgba(11,12,14,.14); --sheen:rgba(255,255,255,.08); --sheen2:rgba(255,255,255,.22); --tint:rgba(0,0,0,.2);
  --ph-bg:rgba(226,118,28,.12); --ph-text:#8A440A;
  --good-text:#1B7A4E; --err-text:#B42318;
  --badge-bg:#0B0C0E; --badge-text:#F2F2F0;
  --btn-dark:#0B0C0E; --btn-dark-text:#F2F2F0;
  --toast-bg:#0B0C0E; --toast-text:#F2F2F0;
  --scrim:rgba(11,12,14,.5); --shadow-lg:0 24px 60px rgba(0,0,0,.28);
  --glow:rgba(226,118,28,.30);

  --band:#0B0C0E; --band-2:#14171B; --band-text:#F2F2F0; --band-text-2:#A9AEB5;
  --band-rule:rgba(255,255,255,.12); --band-rule-strong:rgba(255,255,255,.28);
  --band-drum:#2C3138; --band-drum-rim:#434951; --band-shadow:rgba(0,0,0,.5); --band-ph-text:#F7B97A; --band-ph-bg:rgba(240,154,69,.14);

  --font-display:"Archivo","Arial Narrow","Helvetica Neue",Arial,sans-serif;
  --font-sans:"IBM Plex Sans",system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;
  --font-mono:"IBM Plex Mono",ui-monospace,"SFMono-Regular",Menlo,Consolas,monospace;
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    --bg:#0F1114; --bg-2:#15181C; --surface:#1A1D22;
    --text:#F2F2F0; --text-2:#C3C7CC; --text-3:#9AA0A8;
    --rule:rgba(255,255,255,.1); --rule-strong:rgba(255,255,255,.24);
    --accent-text:#F09A45; --focus:#F09A45;
    --media:#20242A; --drum:#3A4048; --drum-rim:#4C535D; --jug:#D7D3C8; --jug-edge:#A9A498;
    --shadow:rgba(0,0,0,.45); --ph-bg:rgba(240,154,69,.14); --ph-text:#F7B97A;
    --good-text:#5CC995; --err-text:#FF8F80;
    --badge-bg:#F2F2F0; --badge-text:#0B0C0E; --btn-dark:#F2F2F0; --btn-dark-text:#0B0C0E;
    --toast-bg:#F2F2F0; --toast-text:#0B0C0E; --scrim:rgba(0,0,0,.6);
    --band:#08090B; --band-2:#111317;
    color-scheme:dark;
  }
}
:root[data-theme="dark"]{
  --bg:#0F1114; --bg-2:#15181C; --surface:#1A1D22;
  --text:#F2F2F0; --text-2:#C3C7CC; --text-3:#9AA0A8;
  --rule:rgba(255,255,255,.1); --rule-strong:rgba(255,255,255,.24);
  --accent-text:#F09A45; --focus:#F09A45;
  --media:#20242A; --drum:#3A4048; --drum-rim:#4C535D; --jug:#D7D3C8; --jug-edge:#A9A498;
  --shadow:rgba(0,0,0,.45); --ph-bg:rgba(240,154,69,.14); --ph-text:#F7B97A;
  --good-text:#5CC995; --err-text:#FF8F80;
  --badge-bg:#F2F2F0; --badge-text:#0B0C0E; --btn-dark:#F2F2F0; --btn-dark-text:#0B0C0E;
  --toast-bg:#F2F2F0; --toast-text:#0B0C0E; --scrim:rgba(0,0,0,.6);
  --band:#08090B; --band-2:#111317;
  color-scheme:dark;
}

*,*::before,*::after{box-sizing:border-box}
[hidden]{display:none!important}
html{-webkit-text-size-adjust:100%;scroll-padding-top:84px}
body{margin:0;background:var(--bg);color:var(--text);font-family:var(--font-sans);font-size:16px;line-height:1.55;-webkit-font-smoothing:antialiased}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);z-index:60;background:var(--band)}
img,svg{max-width:100%}
a{color:inherit}
p{margin:0}
button,input,select,textarea{font:inherit;color:inherit}
:focus-visible{outline:2px solid var(--focus);outline-offset:2px}
.sr{position:absolute!important;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0);white-space:nowrap}
.wrap{max-width:1280px;margin:0 auto;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
@media (min-width:720px){.wrap{padding-left:max(32px,env(safe-area-inset-left,0px));padding-right:max(32px,env(safe-area-inset-right,0px))}}
.skip{position:absolute;left:12px;top:-60px;z-index:200;background:var(--amber);color:var(--on-amber);padding:10px 14px;font-weight:600;text-decoration:none}
.skip:focus{top:12px}

.display{font-family:var(--font-display);font-stretch:85%;font-weight:850;text-transform:uppercase;letter-spacing:-.01em;line-height:.94;text-wrap:balance;margin:0}
.h1{font-size:clamp(38px,5.6vw,68px)}
.h2{font-size:clamp(32px,4.6vw,58px)}
.h2.xl{font-size:clamp(46px,7.4vw,96px)}
.mono{font-family:var(--font-mono)}
.mono-label{font-family:var(--font-mono);font-size:11.5px;letter-spacing:.12em;text-transform:uppercase;color:var(--text-3);font-weight:500}
.eyebrow{font-family:var(--font-mono);font-size:12px;letter-spacing:.16em;text-transform:uppercase;color:var(--accent-text);font-weight:500}
.lede{font-size:clamp(17px,1.5vw,19px);line-height:1.55;color:var(--text-2);max-width:56ch}
.fine{font-size:13px;color:var(--text-3)}
.ph{background:var(--ph-bg);color:var(--ph-text);font-family:var(--font-mono);font-size:.82em;letter-spacing:0;text-transform:none;padding:1px 5px;border:1px dashed currentColor;border-radius:2px;font-weight:500}
.arr{width:16px;height:16px;flex-shrink:0}

.band{background:var(--band);color:var(--band-text);
  --text:var(--band-text); --text-2:var(--band-text-2); --text-3:var(--band-text-2);
  --rule:var(--band-rule); --rule-strong:var(--band-rule-strong); --accent-text:var(--amber-hi);
  --drum:var(--band-drum); --drum-rim:var(--band-drum-rim); --shadow:var(--band-shadow);
  --surface:var(--band-2); --media:var(--band-2); --ph-text:var(--band-ph-text); --ph-bg:var(--band-ph-bg);
  --btn-dark:var(--band-text); --btn-dark-text:var(--band); --focus:var(--amber-hi)}

/* Buttons */
.btn{display:inline-flex;align-items:center;justify-content:center;gap:10px;min-height:48px;padding:0 22px;border-radius:2px;border:1px solid transparent;font-family:var(--font-display);font-stretch:100%;font-weight:800;font-size:13.5px;letter-spacing:.07em;text-transform:uppercase;text-decoration:none;cursor:pointer;transition:background-color .15s,border-color .15s,color .15s;white-space:nowrap}
.btn-primary{background:var(--amber);color:var(--on-amber)}
.btn-primary:hover{background:var(--amber-hi)}
.btn-ghost,.btn-outline{background:transparent;border-color:var(--rule-strong);color:var(--text)}
.btn-ghost:hover,.btn-outline:hover{border-color:var(--text)}
.btn-dark{background:var(--btn-dark);color:var(--btn-dark-text)}
.btn-dark:hover{opacity:.88}
.btn.block{width:100%}
.btn.sm{min-height:42px;padding:0 16px;font-size:12.5px}
.btn-text{background:none;border:0;padding:4px 0;font-family:var(--font-mono);font-size:12px;letter-spacing:.08em;text-transform:uppercase;color:var(--text-3);cursor:pointer;text-decoration:underline;text-underline-offset:3px}
.btn-text:hover{color:var(--text)}
.btn-row{display:flex;flex-wrap:wrap;gap:12px}

/* Header */
.util{background:var(--band-2);color:var(--band-text-2);font-family:var(--font-mono);font-size:11px;letter-spacing:.12em;text-transform:uppercase;--ph-text:var(--band-ph-text);--ph-bg:var(--band-ph-bg)}
.util-in{display:flex;justify-content:space-between;align-items:center;gap:16px;min-height:34px}
@media (max-width:719px){.util-left{display:none}.util-in{justify-content:center}}
.hdr{position:sticky;top:env(safe-area-inset-top,0px);z-index:50;background:var(--band);color:var(--band-text);border-bottom:1px solid var(--band-rule)}
.hdr-in{display:flex;align-items:center;gap:20px;min-height:68px}
.logo{display:flex;align-items:center;gap:11px;text-decoration:none;color:var(--band-text);flex-shrink:0}
.logo svg{width:32px;height:32px}
.logo-word{display:flex;flex-direction:column;line-height:1}
.logo-word b{font-family:var(--font-display);font-stretch:90%;font-weight:900;font-size:21px;letter-spacing:.05em}
.logo-word span{font-family:var(--font-mono);font-size:9.5px;letter-spacing:.22em;color:var(--amber-hi);margin-top:4px}
.nav{display:flex;gap:26px;margin:0 auto}
.nav a{font-family:var(--font-mono);font-size:12px;letter-spacing:.12em;text-transform:uppercase;text-decoration:none;color:var(--band-text-2);padding:8px 0;border-bottom:2px solid transparent}
.nav a:hover,.nav a[aria-current="page"]{color:var(--band-text);border-bottom-color:var(--amber)}
.hdr-actions{display:flex;gap:2px;margin-left:auto}
.icon-btn{position:relative;display:inline-grid;place-items:center;width:44px;height:44px;border:0;background:none;color:var(--band-text);cursor:pointer;border-radius:2px}
.icon-btn svg{width:22px;height:22px}
.icon-btn:hover{background:var(--band-2)}
.badge{position:absolute;top:3px;right:0;min-width:19px;height:19px;padding:0 5px;border-radius:10px;background:var(--amber);color:var(--on-amber);font:600 11px/19px var(--font-mono);text-align:center}
.menu-btn{display:none}
@media (max-width:1023px){.nav{display:none}.menu-btn{display:inline-grid;margin-left:-10px}}
@media (max-width:379px){.logo-word span{display:none}}

/* Hero */
.hero{position:relative;overflow:hidden}
.hero::before{content:"";position:absolute;right:-8%;top:-10%;width:72%;height:120%;background:radial-gradient(closest-side,var(--glow),transparent);pointer-events:none}
.hero-in{position:relative;display:grid;grid-template-columns:minmax(0,1.05fr) minmax(0,1fr);gap:48px;align-items:center;padding-block:clamp(48px,7vw,104px)}
.hero-copy{display:flex;flex-direction:column;gap:26px;min-width:0}
.hero-h{font-size:clamp(58px,10vw,136px);line-height:.86}
.hero-note{padding-top:22px;border-top:1px solid var(--rule);color:var(--text-2);font-size:14.5px;max-width:54ch}
.hero-note b{color:var(--text);font-weight:600}
.hero-art{display:flex;flex-direction:column;gap:14px;text-decoration:none;color:inherit;min-width:0}
.hero-svg{width:100%;height:auto;display:block}
.cap{display:flex;justify-content:space-between;align-items:flex-end;gap:16px;padding-top:14px;border-top:1px solid var(--rule)}
.cap-no{display:block;font-family:var(--font-mono);font-size:12px;letter-spacing:.12em;color:var(--accent-text);text-transform:uppercase}
.cap b{font-family:var(--font-display);font-stretch:95%;font-size:18px;font-weight:800}
.link-arrow{display:inline-flex;gap:8px;align-items:center;font-family:var(--font-mono);font-size:12px;letter-spacing:.12em;text-transform:uppercase;color:var(--accent-text);white-space:nowrap}
.hero-art:hover .link-arrow,.gcard:hover .link-arrow{text-decoration:underline}
@media (max-width:899px){.hero-in{grid-template-columns:1fr;gap:36px}.hero-art{max-width:520px}}

/* Sections */
.sec{padding-block:clamp(64px,8vw,112px);scroll-margin-top:84px}
.sec-alt{background:var(--bg-2)}
.sec-head{display:flex;justify-content:space-between;align-items:flex-end;gap:20px 40px;flex-wrap:wrap;margin-bottom:40px}
.sec-head > div{display:flex;flex-direction:column;gap:14px;min-width:0}
.sec-aside{max-width:36ch;color:var(--text-2);font-size:15px}
.sec-sub{color:var(--text-2);max-width:58ch}

/* Operations */
.ops-grid{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:1px;background:var(--rule);border:1px solid var(--rule)}
.op-card{display:flex;flex-direction:column;gap:12px;padding:26px 26px 22px;background:var(--surface);text-decoration:none;color:var(--text);min-height:228px;transition:background-color .15s}
.op-card:hover{background:var(--bg-2)}
.op-top{display:flex;justify-content:space-between;gap:12px;align-items:flex-start}
.op-top h3{font-family:var(--font-display);font-stretch:88%;font-weight:850;font-size:22px;line-height:1.02;text-transform:uppercase;margin:0}
.op-card p{color:var(--text-2);font-size:15px;max-width:32ch}
.op-bot{margin-top:auto;display:flex;justify-content:space-between;align-items:flex-end;gap:12px}
.op-icon{width:56px;height:56px;color:var(--accent-text);flex-shrink:0}
.op-icon path,.op-icon circle,.op-icon rect{fill:none;stroke:currentColor;stroke-width:2;stroke-linecap:round;stroke-linejoin:round}
@media (max-width:899px){.ops-grid{grid-template-columns:repeat(2,minmax(0,1fr))}}
@media (max-width:559px){.ops-grid{grid-template-columns:1fr}.op-card{min-height:0}}

/* Product cards */
.pgrid{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:20px}
@media (max-width:1100px){.pgrid{grid-template-columns:repeat(3,minmax(0,1fr))}}
@media (max-width:820px){.pgrid{grid-template-columns:repeat(2,minmax(0,1fr));gap:14px}}
@media (max-width:439px){.pgrid{grid-template-columns:1fr}}
.pcard{display:flex;flex-direction:column;background:var(--surface);border:1px solid var(--rule);min-width:0}
.pcard-media{position:relative;display:block;background:var(--media);aspect-ratio:1/1;max-width:100%}
.pcard-media .vis{position:absolute;left:14%;top:9%;width:72%;height:84%}
.pbadge{position:absolute;top:10px;left:10px;z-index:1;background:var(--badge-bg);color:var(--badge-text);font:500 10.5px/1 var(--font-mono);letter-spacing:.12em;text-transform:uppercase;padding:6px 8px}
.pcard-body{display:flex;flex-direction:column;gap:8px;padding:16px 16px 18px;flex:1}
.pcard-no{font-family:var(--font-mono);font-size:11.5px;letter-spacing:.1em;text-transform:uppercase;color:var(--accent-text)}
.pcard h3{margin:0;font-family:var(--font-display);font-stretch:95%;font-weight:750;font-size:18px;line-height:1.15;text-wrap:balance}
.pcard h3 a{text-decoration:none}
.pcard h3 a:hover{text-decoration:underline}
.pcard-sum{font-size:14px;color:var(--text-2);display:-webkit-box;-webkit-line-clamp:3;-webkit-box-orient:vertical;overflow:hidden}
.pcard-meta{font-family:var(--font-mono);font-size:11.5px;line-height:1.45;color:var(--text-3);margin-top:auto;padding-top:6px}
.pcard-price{font-weight:600;font-size:14.5px}
.pcard .btn{margin-top:4px}
.nw{white-space:nowrap}
@media (max-width:439px){.pcard-media{aspect-ratio:4/3}}
@media (max-width:820px){.pcard-body{padding:12px 12px 14px}.pcard h3{font-size:16.5px}.pcard-sum{font-size:13.5px}}

/* SVG containers */
.vis{display:block}
.v-sh{fill:var(--shadow)} .v-body{fill:var(--drum)} .v-rim{fill:var(--drum-rim)} .v-sheen{fill:var(--sheen)} .v-sheen2{fill:var(--sheen2)} .v-tint{fill:var(--tint)}
.v-handle{fill:none;stroke:var(--drum-rim);stroke-width:4;stroke-linecap:round}
.v-jug{fill:var(--jug);stroke:var(--jug-edge);stroke-width:2}
.v-jhandle{fill:none;stroke:var(--jug-edge);stroke-width:8}
.v-label{fill:var(--label)}
.v-no{font-family:var(--font-mono);font-weight:600;fill:var(--label-ink)}
.v-lab{font-family:var(--font-sans);font-weight:600;font-size:6.2px;letter-spacing:.12em;fill:var(--label-ink-2)}

/* Story band */
.story-in{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1.1fr);gap:56px;padding-block:clamp(72px,9vw,120px);align-items:start}
.story-copy{display:flex;flex-direction:column;gap:24px;align-items:flex-start;min-width:0}
.story-copy > p{color:var(--text-2);max-width:48ch;font-size:17px}
.pull{margin:0;padding-left:20px;border-left:2px solid var(--amber);display:flex;flex-direction:column;gap:10px}
.pull p{font-size:19px;line-height:1.45}
.pull cite{font-style:normal;font-family:var(--font-mono);font-size:12px;letter-spacing:.1em;text-transform:uppercase;color:var(--text-3)}
.facts{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:1px;background:var(--rule);border:1px solid var(--rule)}
.fact{background:var(--band);padding:26px;display:flex;flex-direction:column;gap:8px;min-width:0}
.fact-big{font-family:var(--font-display);font-stretch:85%;font-weight:850;font-size:36px;line-height:1;color:var(--amber-hi);text-transform:uppercase}
.fact p{color:var(--text-2);font-size:14.5px}
@media (max-width:899px){.story-in{grid-template-columns:1fr;gap:40px}}
@media (max-width:519px){.facts{grid-template-columns:1fr}}

/* Kits */
.kit-grid{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:20px}
@media (max-width:999px){.kit-grid{grid-template-columns:1fr;max-width:640px}}
.kit{background:var(--surface);border:1px solid var(--rule);display:flex;flex-direction:column;min-width:0}
.kit-media{background:var(--media);padding:18px 14px 10px;max-width:100%}
.kit-media svg{width:100%;height:auto;display:block}
.kit-body{padding:20px;display:flex;flex-direction:column;gap:14px;flex:1}
.kit h3{font-family:var(--font-display);font-stretch:92%;font-size:22px;font-weight:800;line-height:1.1;margin:0}
.kit-for{color:var(--text-2);font-size:14.5px}
.kit-list{list-style:none;margin:0;padding:0;display:flex;flex-direction:column}
.kit-list li{display:flex;justify-content:space-between;align-items:baseline;gap:12px;font-size:14px;padding:7px 0;border-bottom:1px solid var(--rule)}
.kit-list a{text-decoration:none;min-width:0}
.kit-list a:hover{text-decoration:underline}
.kit-list .k-no{font-family:var(--font-mono);font-size:12px;color:var(--accent-text);margin-right:6px}
.kit-list .k-size{font-family:var(--font-mono);color:var(--text-3);font-size:11.5px;white-space:nowrap}
.kit-foot{margin-top:auto;display:flex;flex-direction:column;gap:12px;padding-top:6px}

/* Spotlight */
.spot-in{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1fr);gap:56px;align-items:center;padding-block:clamp(72px,9vw,120px)}
.spot-art{display:block;background:radial-gradient(closest-side,var(--glow),transparent 72%);max-width:520px;width:100%;justify-self:center}
.spot-art svg{width:78%;margin:0 auto;display:block}
.spot-copy{display:flex;flex-direction:column;gap:22px;min-width:0}
.feat{list-style:none;padding:0;margin:0;border-top:1px solid var(--rule)}
.feat li{display:grid;grid-template-columns:minmax(0,170px) minmax(0,1fr);gap:16px;padding:14px 0;border-bottom:1px solid var(--rule)}
.feat b{font-family:var(--font-display);font-weight:800;font-size:14px;letter-spacing:.05em;text-transform:uppercase}
.feat span{color:var(--text-2);font-size:14.5px}
@media (max-width:899px){.spot-in{grid-template-columns:1fr;gap:28px}.spot-art{max-width:360px}}
@media (max-width:559px){.feat li{grid-template-columns:1fr;gap:4px}}

/* Steps */
.steps{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:28px}
.step{border-top:2px solid var(--text);padding-top:20px;display:flex;flex-direction:column;gap:10px}
.step-num{font-family:var(--font-mono);color:var(--accent-text);font-size:13px;letter-spacing:.12em}
.step h3{font-family:var(--font-display);font-stretch:88%;font-weight:850;text-transform:uppercase;font-size:24px;line-height:1;margin:0}
.step p{color:var(--text-2);max-width:38ch}
@media (max-width:759px){.steps{grid-template-columns:1fr;gap:24px}}

/* Guides */
.guide-grid{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:24px}
@media (max-width:899px){.guide-grid{grid-template-columns:1fr;max-width:640px}}
.gcard{display:flex;flex-direction:column;gap:12px;text-decoration:none;color:inherit;min-width:0}
.gcover{position:relative;aspect-ratio:16/9;max-width:100%;background:var(--band);color:var(--band-text);display:flex;flex-direction:column;justify-content:space-between;padding:18px 20px;overflow:hidden}
.gcover::after{content:"";position:absolute;right:-20%;bottom:-40%;width:70%;height:100%;background:radial-gradient(closest-side,var(--glow),transparent);pointer-events:none}
.gcover-big{font-family:var(--font-display);font-stretch:80%;font-weight:900;font-size:clamp(48px,6vw,76px);line-height:.9;color:var(--amber-hi);position:relative;z-index:1}
.gcover-no{font-family:var(--font-mono);font-size:11.5px;letter-spacing:.12em;text-transform:uppercase;color:var(--band-text-2);position:relative;z-index:1}
.gcard h3{font-family:var(--font-display);font-stretch:95%;font-weight:800;font-size:21px;line-height:1.15;margin:0;text-wrap:balance}
.gcard p{color:var(--text-2);font-size:15px}

/* CTA and newsletter */
.cta{text-align:center;padding-block:clamp(72px,9vw,120px);display:flex;flex-direction:column;align-items:center;gap:22px}
.cta .lede{margin:0 auto}
.cta .btn-row{justify-content:center}
.news-band{border-top:1px solid var(--band-rule)}
.news{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1fr);gap:24px 48px;align-items:center;padding-block:56px}
.news h2{font-size:clamp(30px,3.6vw,44px)}
.news form{display:flex;gap:10px;flex-wrap:wrap}
.news input{flex:1 1 220px;min-width:0;min-height:48px;background:var(--band-text);color:var(--band);border:0;border-radius:2px;padding:0 14px;font-size:16px}
.news .fine{flex-basis:100%}
@media (max-width:799px){.news{grid-template-columns:1fr}}

/* Footer */
.foot{border-top:1px solid var(--band-rule)}
.foot-top{display:grid;grid-template-columns:minmax(0,1.4fr) repeat(3,minmax(0,1fr));gap:40px;padding-block:64px 44px}
.foot-brand{display:flex;flex-direction:column;gap:16px;min-width:0}
.foot h3{font-family:var(--font-mono);font-size:11.5px;letter-spacing:.14em;text-transform:uppercase;color:var(--text-3);font-weight:500;margin:0 0 14px}
.foot ul{list-style:none;margin:0;padding:0;display:flex;flex-direction:column;gap:10px}
.foot a{text-decoration:none;color:var(--text-2);font-size:14.5px}
.foot a.logo{color:var(--text)}
.foot a.logo:hover{text-decoration:none}
.foot a:hover{color:var(--text);text-decoration:underline}
.foot-contact{display:flex;flex-direction:column;gap:8px;color:var(--text-2);font-size:14.5px}
.foot-legal,.foot-bot{display:flex;flex-wrap:wrap;gap:10px 24px;padding-block:18px;border-top:1px solid var(--rule)}
.foot-bot{justify-content:space-between;font-size:13px;color:var(--text-3);padding-bottom:28px}
.foot-bot a{font-size:13px;text-decoration:underline}
.foot-tm{font-size:12.5px;color:var(--text-3);max-width:90ch;padding-bottom:36px}
@media (max-width:899px){.foot-top{grid-template-columns:repeat(2,minmax(0,1fr))}.foot-brand{grid-column:1/-1}}
@media (max-width:479px){.foot-top{grid-template-columns:1fr}}

/* Page heads, shop */
.page-head{padding-block:36px 28px;border-bottom:1px solid var(--rule);display:flex;flex-direction:column;gap:16px}
.crumbs{font-family:var(--font-mono);font-size:12px;letter-spacing:.08em;text-transform:uppercase;color:var(--text-3);display:flex;flex-wrap:wrap;gap:8px}
.crumbs a{text-decoration:none}
.crumbs a:hover{text-decoration:underline;color:var(--text)}
.shop{display:grid;grid-template-columns:240px minmax(0,1fr);gap:40px;padding-block:28px 96px}
@media (max-width:899px){.shop{grid-template-columns:1fr;gap:16px}}
.filters summary{font-family:var(--font-mono);font-size:12px;letter-spacing:.14em;text-transform:uppercase;cursor:pointer;padding:12px 0;border-bottom:1px solid var(--rule);list-style:none;display:flex;justify-content:space-between}
.filters summary::-webkit-details-marker{display:none}
.filters summary::after{content:"+";font-size:16px}
.filters details[open] summary::after{content:"\2212"}
.fgroup{display:flex;flex-direction:column;gap:8px;padding-block:16px;border-bottom:1px solid var(--rule)}
.fgroup ul{list-style:none;margin:0;padding:0;display:flex;flex-direction:column}
.fgroup label{display:flex;align-items:center;gap:10px;font-size:14.5px;padding:5px 0;cursor:pointer}
.fgroup label .n{margin-left:auto;font-family:var(--font-mono);font-size:12px;color:var(--text-3);font-variant-numeric:tabular-nums}
input[type="radio"],input[type="checkbox"]{accent-color:var(--amber);width:16px;height:16px;margin:0;flex-shrink:0}
.toolbar{display:flex;flex-wrap:wrap;gap:12px;align-items:center;margin-bottom:12px}
.toolbar input,.toolbar select,.field input:not([type="radio"]):not([type="checkbox"]),.field select,.field textarea{min-height:46px;border:1px solid var(--rule-strong);background:var(--surface);color:var(--text);border-radius:2px;padding:10px 12px;font-size:16px}
.toolbar input{flex:1 1 260px;min-width:0}
.toolbar select{flex:0 1 220px;min-width:0}
.count{font-family:var(--font-mono);font-size:12px;color:var(--text-3);letter-spacing:.06em;margin-bottom:18px;font-variant-numeric:tabular-nums}
.empty{border:1px dashed var(--rule-strong);padding:32px;display:flex;flex-direction:column;gap:12px;align-items:flex-start}

/* Product detail */
.pdp-grid{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1fr);gap:56px;padding-block:28px 72px;align-items:start}
.pdp-media{background:var(--media);aspect-ratio:1/1;display:grid;place-items:center;max-width:100%;position:sticky;top:100px}
.pdp-media .vis{width:70%;height:auto}
.pdp-info{display:flex;flex-direction:column;gap:20px;min-width:0}
.chips{display:flex;flex-wrap:wrap;gap:8px}
.chip{font-family:var(--font-mono);font-size:11.5px;letter-spacing:.06em;text-transform:uppercase;padding:6px 10px;border:1px solid var(--rule-strong);color:var(--text-2);text-decoration:none;line-height:1.3}
a.chip:hover{border-color:var(--text);color:var(--text)}
fieldset{border:0;margin:0;padding:0;min-width:0}
.sizes{display:flex;flex-wrap:wrap;gap:8px;margin-top:10px}
.size{position:relative}
.size input{position:absolute;opacity:0;width:1px;height:1px}
.size span{display:inline-flex;align-items:center;min-height:42px;padding:0 14px;border:1px solid var(--rule-strong);font-size:14px;cursor:pointer;background:var(--surface)}
.size input:checked + span{border-color:var(--text);box-shadow:inset 0 0 0 1px var(--text);font-weight:600}
.size input:focus-visible + span{outline:2px solid var(--focus);outline-offset:2px}
.buy{display:flex;flex-direction:column;gap:18px;padding:20px;border:1px solid var(--rule);background:var(--surface)}
.buy-row{display:flex;flex-wrap:wrap;gap:12px;align-items:center}
.stepper{display:inline-flex;align-items:stretch;border:1px solid var(--rule-strong);background:var(--surface)}
.stepper button{width:44px;border:0;background:none;cursor:pointer;font-size:18px;line-height:1}
.stepper button:hover{background:var(--bg-2)}
.stepper input{width:56px;text-align:center;border:0;border-left:1px solid var(--rule);border-right:1px solid var(--rule);background:none;font-variant-numeric:tabular-nums;font-size:16px;min-height:46px;color:var(--text)}
.stepper.sm button{width:34px;font-size:16px}
.stepper.sm input{width:44px;min-height:36px;font-size:14px}
.price-line{font-size:14.5px;color:var(--text-2)}
.price-line b{color:var(--text)}
.docs{display:flex;flex-direction:column;gap:10px;padding-top:4px}
.docs-row{display:flex;flex-wrap:wrap;gap:10px}
@media (max-width:899px){.pdp-grid{grid-template-columns:1fr;gap:24px}.pdp-media{position:static;max-width:520px}}
@media (max-width:599px){.pdp-media{aspect-ratio:16/10}.pdp-media .vis{width:auto;height:88%}}

/* Op / page bands */
.page-band{padding-block:clamp(48px,6vw,88px)}
.page-band-in{display:grid;grid-template-columns:minmax(0,1.3fr) minmax(0,1fr);gap:40px;align-items:end}
.page-band-in > div{display:flex;flex-direction:column;gap:20px;min-width:0}
.page-band .op-icon{width:88px;height:88px;justify-self:end}
@media (max-width:799px){.page-band-in{grid-template-columns:1fr}.page-band .op-icon{justify-self:start;width:64px;height:64px;order:-1}}
.picks{display:flex;flex-direction:column;border-top:1px solid var(--rule)}
.pick{display:grid;grid-template-columns:96px minmax(0,1fr) auto;gap:18px;align-items:center;padding:14px 0;border-bottom:1px solid var(--rule)}
.pick-vis{background:var(--media);aspect-ratio:1/1;display:grid;place-items:center}
.pick-vis .vis{width:78%}
.pick-main{display:flex;flex-direction:column;gap:4px;min-width:0}
.pick-main a{font-weight:600;text-decoration:none}
.pick-main a:hover{text-decoration:underline}
.pick-main p{color:var(--text-2);font-size:14.5px}
@media (max-width:599px){.pick{grid-template-columns:64px minmax(0,1fr)}.pick .btn{grid-column:2;justify-self:start}}

/* Forms */
.form{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:16px 18px}
.field{display:flex;flex-direction:column;gap:6px;min-width:0}
.field.full{grid-column:1/-1}
.field label,.field .lbl{font-size:13.5px;font-weight:600}
.field .opt{font-weight:400;color:var(--text-3)}
.field input:not([type="radio"]):not([type="checkbox"]),.field select,.field textarea{width:100%}
.field textarea{min-height:110px;resize:vertical}
.field [aria-invalid="true"]{border-color:var(--err-text)}
.err{color:var(--err-text);font-size:13px}
.check{display:flex;gap:10px;align-items:flex-start;font-size:14.5px}
.check input{margin-top:3px}
.seg{display:flex;flex-wrap:wrap;gap:8px}
@media (max-width:599px){.form{grid-template-columns:1fr}}
.panel{background:var(--surface);border:1px solid var(--rule);padding:clamp(18px,3vw,28px);display:flex;flex-direction:column;gap:18px;min-width:0}
.success{border-left:3px solid var(--good-text)}
.success h3{margin:0;font-family:var(--font-display);font-weight:850;text-transform:uppercase;font-size:22px}

/* Checkout */
.checkout{display:grid;grid-template-columns:minmax(0,1.3fr) minmax(0,1fr);gap:40px;padding-block:28px 96px;align-items:start}
.summary{background:var(--surface);border:1px solid var(--rule);padding:22px;position:sticky;top:100px;display:flex;flex-direction:column;gap:12px;min-width:0}
.sum-row{display:flex;justify-content:space-between;gap:12px;font-size:14px;padding:10px 0;border-bottom:1px solid var(--rule)}
.sum-row span:last-child{font-family:var(--font-mono);font-size:12.5px;color:var(--text-3);text-align:right;white-space:nowrap}
.sum-row span:first-child{min-width:0}
@media (max-width:899px){.checkout{grid-template-columns:1fr}.summary{position:static}}
.confirm{max-width:780px;padding-block:56px 96px;display:flex;flex-direction:column;gap:24px}
.ref{font-family:var(--font-mono);font-size:clamp(22px,3vw,30px);letter-spacing:.06em;color:var(--accent-text)}
.notice{border:1px dashed var(--rule-strong);padding:14px 16px;font-size:14px;color:var(--text-2);background:var(--bg-2)}
.olist{counter-reset:o;list-style:none;margin:0;padding:0;display:flex;flex-direction:column;gap:12px}
.olist li{display:grid;grid-template-columns:36px minmax(0,1fr);gap:10px}
.olist li::before{counter-increment:o;content:counter(o,decimal-leading-zero);font-family:var(--font-mono);color:var(--accent-text);font-size:13px;padding-top:2px}

/* Prose */
.prose{max-width:68ch;display:flex;flex-direction:column;gap:18px;font-size:17px;line-height:1.65}
.prose h2{font-family:var(--font-display);font-stretch:90%;font-weight:850;text-transform:uppercase;font-size:24px;line-height:1.05;margin:14px 0 0}
.prose ul,.prose ol{margin:0;padding-left:22px;display:flex;flex-direction:column;gap:6px}
.prose a{color:var(--accent-text)}
.two-col{display:grid;grid-template-columns:minmax(0,1.4fr) minmax(0,1fr);gap:56px;padding-block:40px 96px;align-items:start}
@media (max-width:899px){.two-col{grid-template-columns:1fr;gap:32px}}
.side{display:flex;flex-direction:column;gap:16px;min-width:0}
.faq{display:flex;flex-direction:column;border-top:1px solid var(--rule)}
.faq details{border-bottom:1px solid var(--rule)}
.faq summary{cursor:pointer;padding:18px 0;font-weight:600;font-size:16.5px;list-style:none;display:flex;justify-content:space-between;gap:16px}
.faq summary::-webkit-details-marker{display:none}
.faq summary::after{content:"+";font-family:var(--font-mono);color:var(--accent-text)}
.faq details[open] summary::after{content:"\2212"}
.faq details p{padding-bottom:18px;color:var(--text-2);max-width:68ch}

/* Overlays */
.scrim{position:fixed;inset:0;background:var(--scrim);z-index:80}
.drawer{position:fixed;top:0;right:0;bottom:0;width:min(440px,100%);z-index:90;background:var(--bg);color:var(--text);display:flex;flex-direction:column;box-shadow:var(--shadow-lg);padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px);padding-right:env(safe-area-inset-right,0px)}
.drawer-head{display:flex;justify-content:space-between;align-items:center;gap:12px;padding:16px 20px;border-bottom:1px solid var(--rule)}
.drawer-head h2{font-size:26px}
.drawer-head .icon-btn{color:var(--text)}
.drawer-head .icon-btn:hover{background:var(--bg-2)}
.drawer-body{flex:1;overflow:auto;padding:4px 20px}
.drawer-foot{padding:16px 20px;border-top:1px solid var(--rule);display:flex;flex-direction:column;gap:10px}
.line{display:grid;grid-template-columns:72px minmax(0,1fr);gap:14px;padding:16px 0;border-bottom:1px solid var(--rule)}
.line-vis{background:var(--media);display:grid;place-items:center;aspect-ratio:1/1;align-self:start}
.line-vis .vis{width:80%}
.line-main{display:flex;flex-direction:column;gap:8px;min-width:0}
.line-name{text-decoration:none;font-weight:600;font-size:14.5px;line-height:1.3}
.line-name .mono{display:block;font-size:11px;letter-spacing:.1em;color:var(--accent-text);font-weight:500}
.line select{min-height:38px;font-size:14px;border:1px solid var(--rule-strong);background:var(--surface);color:var(--text);padding:6px 8px;border-radius:2px;max-width:100%}
.line-row{display:flex;justify-content:space-between;align-items:center;gap:12px}
.search-panel{position:fixed;inset:0 0 auto;z-index:90;padding-top:env(safe-area-inset-top,0px);border-bottom:1px solid var(--band-rule);box-shadow:var(--shadow-lg)}
.search-panel form{display:flex;gap:10px;padding-block:16px}
.search-panel input{flex:1;min-width:0;min-height:52px;background:var(--band-2);border:1px solid var(--band-rule-strong);color:var(--band-text);padding:0 16px;font-size:17px;border-radius:2px}
.search-results{padding-bottom:16px;max-height:62vh;overflow:auto}
.sr-row{display:grid;grid-template-columns:52px minmax(0,1fr);gap:14px;align-items:center;padding:10px 0;border-top:1px solid var(--band-rule);text-decoration:none}
.sr-row .pick-vis{background:var(--band-2)}
.sr-row b{display:block;font-weight:600}
.sr-row span{font-size:13.5px;color:var(--band-text-2)}
.sr-hint{padding:4px 0 16px;color:var(--band-text-2);font-size:14px}
.mnav{position:fixed;top:0;left:0;bottom:0;width:min(360px,88%);z-index:90;padding:calc(env(safe-area-inset-top,0px) + 14px) 24px calc(env(safe-area-inset-bottom,0px) + 24px) max(24px,env(safe-area-inset-left,0px));overflow:auto;display:flex;flex-direction:column;gap:4px}
.mnav-head{display:flex;justify-content:space-between;align-items:center;margin-bottom:10px}
.mnav > a{font-family:var(--font-display);font-stretch:88%;font-weight:850;text-transform:uppercase;font-size:24px;text-decoration:none;padding:10px 0;border-bottom:1px solid var(--band-rule)}
.mnav-sub{display:flex;flex-direction:column;padding:12px 0}
.mnav-sub a{font-size:15.5px;color:var(--band-text-2);text-decoration:none;padding:7px 0}
.toast{position:fixed;left:50%;bottom:calc(20px + env(safe-area-inset-bottom,0px));transform:translateX(-50%);z-index:100;background:var(--toast-bg);color:var(--toast-text);padding:10px 10px 10px 18px;display:flex;gap:14px;align-items:center;width:max-content;max-width:calc(100% - 32px);box-shadow:var(--shadow-lg);font-size:14.5px}
.toast .btn{min-height:38px;padding:0 14px;font-size:12px}
@keyframes slidein{from{transform:translateX(100%)}to{transform:none}}
@keyframes slidedown{from{transform:translateY(-100%)}to{transform:none}}
@keyframes slideleft{from{transform:translateX(-100%)}to{transform:none}}
.drawer:not([hidden]){animation:slidein .22s ease-out}
.search-panel:not([hidden]){animation:slidedown .2s ease-out}
.mnav:not([hidden]){animation:slideleft .22s ease-out}
@media (prefers-reduced-motion: reduce){*,*::before,*::after{animation:none!important;transition:none!important;scroll-behavior:auto!important}}
main:focus{outline:none}
</style>

      title: 'Why common rail diesels stick injectors on ULSD',
      excerpt: 'Internal diesel injector deposits cost power and fuel economy. Here is what causes them and what clears them.',
      body: '<p>Modern diesel engines run high pressure common rail injectors with very tight clearances. Ultra low sulfur diesel (ULSD) cleaned up emissions, but today\'s fuel can leave deposits inside the injector itself. The industry calls them internal diesel injector deposits, or IDID.</p>' +
        '<h2>What it looks like</h2><ul><li>Hard starts and rough idle</li><li>Lost power and a drop in fuel economy</li><li>Injectors that stick or need replacing early</li><li>More frequent DPF regenerations</li></ul>' +
        '<h2>Why ordinary cleaners miss it</h2><p>Older additives were built to clean the nozzle tip. IDID forms inside the injector body, where the needle moves. It takes detergent chemistry built for those deposits.</p>' +

      excerpt: 'Phase separation can stall an outboard on the water. Stabilizers prevent it. Nothing reverses it.',
      body: '<p>Most pump gas is blended with ethanol, usually 10% (E10). Ethanol pulls in water. Around a marina or a humid shed, a tank that sits for weeks can take on enough water to separate.</p>' +
        '<h2>What phase separation is</h2><p>Once the fuel holds more water than it can carry, the water and much of the ethanol drop to the bottom of the tank as a separate layer. What stays on top is gasoline with less octane. If the pickup draws from the bottom layer, the engine can stall or run poorly.</p>' +
        '<h2>What a treatment can and can\'t do</h2><p>A stabilizer helps prevent separation. It does not reverse it. Once fuel has separated, the bottom layer has to come out.</p>' +
        '<h2>Keep it from happening</h2><ul><li>Treat fuel when you fill up, not after it sits</li><li>Use fresh fuel and don\'t leave a part-full tank sitting for weeks</li><li>Check water separators and filters often</li><li>For 2-cycle outboards, <a href="#/product/220">Odyssey 220</a> has fuel stabilization built in</li></ul>' +

      '<div class="foot-legal">' + Object.keys(LEGAL).map(function (k) { return '<a href="#/legal/' + k + '">' + esc(LEGAL[k]) + '</a>'; }).join('') + '</div>' +
      '<div class="foot-bot"><span>&copy; ' + new Date().getFullYear() + ' ' + esc(CONFIG.legalName) + '. All rights reserved.</span><span>Digital experience by <a href="https://butler-performance.com" target="_blank" rel="noopener">Butler Performance</a></span></div>' +
      '<p class="foot-tm">Primrose, Odyssey, Syn-O-Gen, Armor Plate, Moly-D, Enviro Blend, Klenz ID, Protect-O-Lube and other Primrose product names are trademarks of Primrose Oil Company, Inc. Sager Petroleum Solutions is an independent distributor. Always follow the product label, Technical Data Sheet and Safety Data Sheet.</p>' +
      '</div>';
  }
  function renderMenu() {
    $('#mnav').innerHTML = '<div class="mnav-head"><span class="mono-label">Menu</span><button class="icon-btn" type="button" data-action="close-menu" aria-label="Close menu">' + CLOSE + '</button></div>' +
      '<a href="#/shop">Shop all</a><a href="#/shop?type=fuel-additives">Fuel additives</a><a href="#/ops">Operations</a><a href="#/kits">Kits</a><a href="#/bulk">Bulk &amp; fleet</a><a href="#/guides">Guides</a><a href="#/about">About</a><a href="#/contact">Contact</a>' +
      '<div class="mnav-sub"><span class="mono-label" style="margin-bottom:6px">Product types</span>' + TYPES.map(function (t) { return '<a href="#/shop?type=' + t.id + '">' + esc(t.name) + '</a>'; }).join('') + '</div>' +
      '<p class="fine" style="color:var(--band-text-2)">Bulk pricing: ' + ph(CONFIG.phone) + '</p>';
  }

  /* ---------- Cart ---------- */
  var cart = store.get('sps-order-v1', []).filter(function (l) { return BY_ID[l.id] && BY_ID[l.id].sizes.indexOf(l.size) > -1; });
  function cartCount() { return cart.reduce(function (n, l) { return n + l.qty; }, 0); }
  function clampQty(v) { v = parseInt(v, 10); return isNaN(v) || v < 1 ? 1 : Math.min(v, 999); }
  function saveCart() {
    store.set('sps-order-v1', cart);
    var b = $('#cart-badge'), n = cartCount();
    b.textContent = n; b.hidden = n === 0;
    if (!$('#drawer').hidden) renderDrawer();
  }
  function mergeLine(id, size, qty) {
    var l = cart.filter(function (x) { return x.id === id && x.size === size; })[0];
    if (l) l.qty = Math.min(999, l.qty + qty); else cart.push({ id: id, size: size, qty: qty });
  }
  function addToCart(id, size, qty) {
    var p = BY_ID[id]; if (!p) return;
    size = size && p.sizes.indexOf(size) > -1 ? size : defaultSize(p);
    qty = qty || 1;
    mergeLine(id, size, qty);
    saveCart();
    toast('Added No. ' + p.no + ', ' + size + (qty > 1 ? ' x ' + qty : ''));
  }
  function renderDrawer() {
    var n = cartCount();
    $('#drawer').innerHTML = '<div class="drawer-head"><h2 class="display" id="drawer-title">Your order <span class="mono" style="font-size:16px">(' + n + ')</span></h2><button class="icon-btn" type="button" data-action="close-cart" aria-label="Close your order">' + CLOSE + '</button></div>' +
      '<div class="drawer-body">' + (cart.length ? cart.map(function (l, i) {
        var p = BY_ID[l.id];
        return '<div class="line"><a class="line-vis" href="' + pHref(p) + '" tabindex="-1" aria-hidden="true">' + vis(p) + '</a><div class="line-main">' +
          '<a class="line-name" href="' + pHref(p) + '"><span class="mono">No. ' + esc(p.no) + '</span>' + esc(p.name) + '</a>' +
          '<label class="sr" for="ls-' + i + '">Pack size</label><select id="ls-' + i + '" data-line-size="' + i + '">' + p.sizes.map(function (s) { return '<option' + (s === l.size ? ' selected' : '') + '>' + esc(s) + '</option>'; }).join('') + '</select>' +
          '<div class="line-row"><div class="stepper sm"><button type="button" data-action="line-step" data-i="' + i + '" data-d="-1" aria-label="Decrease quantity">&minus;</button><input id="lq-' + i + '" data-line-qty="' + i + '" inputmode="numeric" value="' + l.qty + '" aria-label="Quantity"><button type="button" data-action="line-step" data-i="' + i + '" data-d="1" aria-label="Increase quantity">+</button></div>' +
          '<span class="fine">' + esc(priceText(p, l.size)) + '</span><button class="btn-text" type="button" data-action="line-remove" data-i="' + i + '">Remove</button></div></div></div>';
      }).join('') : '<div class="empty" style="margin-top:20px"><b>Your order is empty.</b><p class="fine">Start with fuel additives or browse all ' + PRODUCTS.length + ' products.</p><a class="btn btn-outline sm" href="#/shop?type=fuel-additives" data-action="close-cart">Fuel additives</a></div>') + '</div>' +
      (cart.length ? '<div class="drawer-foot"><p class="fine">Sager confirms price, freight and timing before anything ships. No payment now.</p><a class="btn btn-primary block" href="#/checkout" data-action="close-cart">Request pricing ' + ARROW + '</a><button class="btn btn-outline block" type="button" data-action="close-cart">Keep shopping</button></div>' : '');
  }

  /* ---------- Overlays ---------- */
  var lastFocus = null;
  function openLayer(id, render) {
    closeLayers(true);
    lastFocus = document.activeElement;
    if (render) render();
    $('#' + id).hidden = false; $('#scrim').hidden = false;
    document.body.style.overflow = 'hidden';
    var f = $('#' + id).querySelector('input, button, a[href], select');
    if (f) f.focus();
  }
  function closeLayers(silent) {
    ['drawer', 'search', 'mnav'].forEach(function (id) { $('#' + id).hidden = true; });
    $('#scrim').hidden = true;
    document.body.style.overflow = '';
    if (!silent && lastFocus && document.contains(lastFocus)) lastFocus.focus();
  }
  function renderSearch() {
    var q = $('#search-q').value.trim().toLowerCase();
    var res = $('#search-results');
    if (!q) { res.innerHTML = '<p class="sr-hint">Try 5007, Odyssey, grease, winter or biodegradable.</p>'; return; }
    var list = filterProducts({ type: '', op: '', tags: [], q: q, sort: '' });
    res.innerHTML = list.length ? list.slice(0, 8).map(function (p) {
      return '<a class="sr-row" href="' + pHref(p) + '" data-action="close-search-nav"><span class="pick-vis">' + vis(p) + '</span><span><b>No. ' + esc(p.no) + ' · ' + esc(p.name) + '</b><span>' + esc(TYPE[p.type].name) + '</span></span></a>';
    }).join('') + (list.length > 8 ? '<a class="link-arrow" style="padding:12px 0;display:inline-flex" href="#/shop?q=' + encodeURIComponent(q) + '" data-action="close-search-nav">See all ' + list.length + ' results ' + ARROW + '</a>' : '') : '<p class="sr-hint">No products match. Try a product number like 327 or a word like hydraulic.</p>';
  }
  var toastTimer;
  function toast(msg) {
    var t = $('#toast');
    t.innerHTML = '<span>' + esc(msg) + '</span><button class="btn btn-primary" type="button" data-action="open-cart">View order</button>';
    t.hidden = false;
    clearTimeout(toastTimer);
    toastTimer = setTimeout(function () { t.hidden = true; }, 4200);
  }

  /* ---------- Forms ---------- */
  function validate(id) {
    var el = document.getElementById(id); if (!el || el.offsetParent === null) return true;
    var v = el.value.trim(), msg = '';
    if (id.slice(-4) === 'name' && !v) msg = 'Enter your name.';
    else if (id.slice(-5) === 'phone' && v.replace(/\D/g, '').length < 10) msg = 'Enter a phone number with area code.';
    else if (id.slice(-5) === 'email' && !/^[^\s@]+@[^\s@]+\.[^\s@]+$/.test(v)) msg = 'Enter an email address like name@company.com.';
    else if (id.slice(-3) === 'zip' && !/^\d{5}$/.test(v)) msg = 'Enter a 5-digit ZIP code.';
    else if (id.slice(-3) === 'msg' && !v) msg = 'Tell Sager what you need.';
    var err = document.getElementById(id + '-err');
    el.setAttribute('aria-invalid', msg ? 'true' : 'false');
    if (err) { err.textContent = msg; err.hidden = !msg; }
    return !msg;
  }
  function bindForm(sel, ids, onOk) {
    var f = $(sel); if (!f) return;
    ids.forEach(function (id) { var el = document.getElementById(id); if (el) el.addEventListener('input', function () { if (el.getAttribute('aria-invalid') === 'true') validate(id); }); });
    f.addEventListener('submit', function (e) {
      e.preventDefault();
      var bad = ids.filter(function (id) { return !validate(id); });
      if (bad.length) { document.getElementById(bad[0]).focus(); return; }
      if (sel !== '#co-form') submitPayload({ kind: sel.slice(1, -5), fields: ids.reduce(function (o, id) { var el = document.getElementById(id); o[id] = el ? el.value : ''; return o; }, {}) });
      onOk();
      var s = $('#success'); if (s) s.focus();
    });
  }
  function submitPayload(data) {
    if (!CONFIG.formEndpoint) return;
    try { fetch(CONFIG.formEndpoint, { method: 'POST', headers: { 'Content-Type': 'application/json' }, body: JSON.stringify(data) }); } catch (e) { /* surfaced by the production build */ }
  }

  /* ---------- Router ---------- */
  function parseHash() {
    var h = (location.hash || '').replace(/^#/, '') || '/';
    var i = h.indexOf('?');
    var path = i > -1 ? h.slice(0, i) : h;
    return { path: path, parts: path.split('/').filter(Boolean), q: new URLSearchParams(i > -1 ? h.slice(i + 1) : '') };
  }
  var ROUTES = { '': viewHome, shop: viewShop, product: viewProduct, ops: function (r) { return r.parts[1] ? viewOp(r) : viewOpsIndex(); }, kits: viewKits, bulk: viewBulk, about: viewAbout, contact: viewContact, guides: viewGuides, faq: viewFaq, checkout: viewCheckout, order: viewOrder, legal: viewLegal };
  function setActiveNav(key) {
    $$('.nav a').forEach(function (a) { a.removeAttribute('aria-current'); });
    var n = key === 'shop' && shopState.type === 'fuel-additives' ? 'fuel' : key;
    var a = $('.nav a[data-nav="' + n + '"]'); if (a) a.setAttribute('aria-current', 'page');
  }
  var first = true;
  function route() {
    var r = parseHash();
    var key = r.parts[0] || '';
    var res = (ROUTES[key] || viewNotFound)(r);
    var main = $('#main');
    main.innerHTML = res.html;
    document.title = res.title ? res.title + ' | ' + CONFIG.name : CONFIG.name;
    setActiveNav(res.nav || key);
    closeLayers(true);
    window.scrollTo(0, 0);
    if (res.after) res.after();
    if (!first) main.focus({ preventScroll: true });
    first = false;
  }

  /* ---------- Events ---------- */
  document.addEventListener('click', function (e) {
    var t = e.target.closest('[data-action]');
    if (!t) return;
    var a = t.getAttribute('data-action');
    if (a === 'quick-add') { addToCart(t.getAttribute('data-id'), t.getAttribute('data-size')); }
    else if (a === 'add-kit') {
      var k = KITS.filter(function (x) { return x.id === t.getAttribute('data-id'); })[0];
      k.items.forEach(function (it) { mergeLine(BY_ID[it[0]].id, it[1], 1); });
      saveCart(); toast('Added ' + k.name + ' (4 products)');
    }
    else if (a === 'open-cart') { e.preventDefault(); $('#toast').hidden = true; openLayer('drawer', renderDrawer); }
    else if (a === 'close-cart') { closeLayers(t.tagName === 'A'); }
    else if (a === 'open-search') { openLayer('search', renderSearch); }
    else if (a === 'close-search') { closeLayers(); }
    else if (a === 'close-search-nav') { closeLayers(true); }
    else if (a === 'open-menu') { openLayer('mnav', renderMenu); }
    else if (a === 'close-menu') { closeLayers(); }
    else if (a === 'scroll') { var el = document.getElementById(t.getAttribute('data-target')); if (el) el.scrollIntoView({ behavior: REDUCED ? 'auto' : 'smooth' }); }
    else if (a === 'skip') { e.preventDefault(); $('#main').focus(); }
    else if (a === 'clear-filters') { shopState = { type: '', op: '', tags: [], q: '', sort: '' }; try { history.replaceState(null, '', '#/shop'); } catch (err) { /* ignore */ } route(); }
    else if (a === 'step') { var inp = document.getElementById(t.getAttribute('data-target')); inp.value = clampQty(clampQty(inp.value) + Number(t.getAttribute('data-d'))); }
    else if (a === 'line-step') { var i = +t.getAttribute('data-i'); cart[i].qty = clampQty(cart[i].qty + Number(t.getAttribute('data-d'))); saveCart(); var f = document.getElementById('lq-' + i); if (f) f.focus(); }
    else if (a === 'line-remove') { cart.splice(+t.getAttribute('data-i'), 1); saveCart(); var c = $('#drawer .icon-btn'); if (c) c.focus(); }
  });
  document.addEventListener('change', function (e) {
    var t = e.target;
    if (t.hasAttribute('data-line-size')) {
      var i = +t.getAttribute('data-line-size'), l = cart.splice(i, 1)[0];
      mergeLine(l.id, t.value, l.qty); saveCart();
    } else if (t.hasAttribute('data-line-qty')) {
      cart[+t.getAttribute('data-line-qty')].qty = clampQty(t.value); saveCart();
    }
  });
  document.addEventListener('submit', function (e) {
    if (e.target.id === 'news-form') {
      e.preventDefault();
      var v = $('#nl-email').value.trim(), m = $('#nl-msg');
      if (!/^[^\s@]+@[^\s@]+\.[^\s@]+$/.test(v)) { m.textContent = 'Enter an email address like name@company.com.'; $('#nl-email').focus(); return; }
      submitPayload({ kind: 'newsletter', email: v });
      m.textContent = CONFIG.formEndpoint ? 'You are on the list. Watch for the first email from Sager.' : 'Prototype mode: signup not sent. The form endpoint is not connected yet.';
      e.target.reset();
    } else if (e.target.id === 'search-form') {
      e.preventDefault();
      var q = $('#search-q').value.trim();
      closeLayers(true);
      location.hash = '#/shop' + (q ? '?q=' + encodeURIComponent(q) : '');
    }
  });
  $('#search-q').addEventListener('input', renderSearch);
  $('#scrim').addEventListener('click', function () { closeLayers(); });
  document.addEventListener('keydown', function (e) {
    if (e.key === 'Escape' && !$('#scrim').hidden) closeLayers();
    if (e.key === 'Tab' && !$('#scrim').hidden) {
      var layer = ['drawer', 'search', 'mnav'].map(function (id) { return $('#' + id); }).filter(function (el) { return !el.hidden; })[0];
      if (!layer) return;
      var f = $$('a[href], button, input, select, textarea', layer).filter(function (el) { return !el.disabled && el.offsetParent !== null; });
      if (!f.length) return;
      if (e.shiftKey && document.activeElement === f[0]) { e.preventDefault(); f[f.length - 1].focus(); }
      else if (!e.shiftKey && document.activeElement === f[f.length - 1]) { e.preventDefault(); f[0].focus(); }
    }
  });
  window.addEventListener('hashchange', route);

  $$('[data-cfg="phone"]').forEach(function (el) { el.innerHTML = ph(CONFIG.phone); });
  renderFooter();
  saveCart();
  route();
})();
</script>
</body>
</html>
